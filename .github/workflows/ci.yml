name: CI

# Chạy bộ test backend (gồm test cô lập cross-tenant — cơ chế 2, lớp 2) trên mỗi push và PR.
# Runner ubuntu-latest có Docker sẵn nên Testcontainers chạy được; CI không có TLS interception
# của công ty nên không dính truststore như máy dev (xem CLAUDE.md).

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test backend
        run: mvn -f backend/pom.xml --batch-mode test
