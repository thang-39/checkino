spring:
  application:
    name: checkino

  # Cơ chế 2 (M1-S03): app runtime nối bằng role KHÔNG-superuser checkino_app để RLS có hiệu lực
  # (superuser bỏ qua RLS). DDL/migration chạy bằng role đặc quyền checkino qua spring.flyway.*.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkino}
    username: ${APP_DB_USER:checkino_app}
    password: ${APP_DB_PASSWORD:checkino_app}

  jpa:
    hibernate:
      # Schema do Flyway làm chủ. ddl-auto KHÔNG được là update/create — để Hibernate sinh
      # schema là mất quyền kiểm soát ngay từ story đầu.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migration cần quyền tạo role + bảng → chạy bằng role đặc quyền, KHÔNG phải checkino_app.
    # checkino_app do V2 tạo, nên phải để Flyway chạy trước bằng user này.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkino}
    user: ${DB_USER:checkino}
    password: ${DB_PASSWORD:checkino}

  thymeleaf:
    # /q/{code} server-render (PLAN.md § 1.2)
    prefix: classpath:/templates/

server:
  port: ${PORT:8080}

logging:
  level:
    com.checkino: INFO
