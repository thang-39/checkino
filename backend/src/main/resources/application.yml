spring:
  application:
    name: checkino

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkino}
    username: ${DB_USER:checkino}
    password: ${DB_PASSWORD:checkino}

  jpa:
    hibernate:
      # Schema do Flyway làm chủ. ddl-auto KHÔNG được là update/create — để Hibernate sinh
      # schema là mất quyền kiểm soát ngay từ story đầu.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    # /q/{code} server-render (PLAN.md § 1.2)
    prefix: classpath:/templates/

server:
  port: ${PORT:8080}

logging:
  level:
    com.checkino: INFO
