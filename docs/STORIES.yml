# Checkino — backlog thi hành
#
# ĐÂY LÀ NGUỒN SỰ THẬT DUY NHẤT Ở MỨC VIỆC.
# Không có file nào khác được chứa chia việc / acceptance criteria / thứ tự phụ thuộc.
#
# Phân tầng tài liệu (chi tiết ở README.md):
#   DECISIONS.md      = tại sao            → thắng mọi tranh chấp
#   PRD.md            = sản phẩm làm gì    → thắng về hành vi sản phẩm
#   PLAN.md           = stack + milestone  → thắng về ý định milestone
#   docs/STORIES.yml  = việc phải làm      → thắng về chia việc  ← file này
#   GitHub issues     = trạng thái         → render một chiều từ file này, KHÔNG phải nguồn
#
# Quy tắc:
#   - `refs` TRỎ tới mục docs, không sao lại nội dung. Trỏ bằng tên mục, không bằng số dòng.
#   - `ac` (acceptance criteria) là nội dung MỚI, không có ở docs. Phải kiểm chứng được bằng
#     một lệnh chạy hoặc một test — không phải mô tả lại scope.
#   - Story > 2 ngày part-time thì tách.
#   - Phát hiện quyết định còn thiếu khi làm → ghi ngược vào DECISIONS.md, không quyết ngầm.
#   - `issue: null` → chưa sync. `/sync-issues` điền số vào đây, nên chạy lại là update.
#   - Thêm story mới → dùng skill `write-story`, đừng viết tay tuỳ ý.

