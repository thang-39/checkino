note_effort: |
  Tổng ước lượng: M0 2.5d · M1 17d · M2 16d · M3 7.5d · M4 18.5d (tổng 61.5d).
  M0→M3 = 43 ngày part-time. Ở 15–20h/tuần (~2–2.5 ngày-người/tuần) là 17–21 TUẦN,
  không phải 8 tuần như PLAN.md § 4 nêu. PLAN chỉ ước lượng đúng hai hạng mục
  (audit_log ~½–1d, offline mức 2 ~2–3d) rồi suy ra tổng.
  Không nên ép số xuống. Hai lựa chọn thật: nhận mốc ~4–5 tháng tới hết M3,
  hoặc dùng danh sách cắt ở PLAN.md § 6 (① M3-S10 Sheet mirror ② M2-S11 GPS)
  — cắt cả hai chỉ giảm ~3 ngày, nên chủ yếu là phải nhận mốc.

